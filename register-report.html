<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ทะเบียนเงิน 3 หมวด — ระบบบัญชีการเงิน</title>
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header"><img src="assets/img/logo-obec.png" alt="" class="sidebar-logo" onerror="this.style.display='none'"><div class="sidebar-title">ระบบบัญชีการเงิน<br><small>โรงเรียน สพฐ.</small></div></div>
    <div class="sidebar-user"><img src="assets/img/default-avatar.png" class="sidebar-user-photo" id="user-photo"><div class="sidebar-user-info"><div class="sidebar-user-name" id="user-name"></div><div class="sidebar-user-role" id="user-role"></div></div></div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="nav-item"><span class="nav-icon">🏠</span> Dashboard</a>
      <a href="transactions.html" class="nav-item"><span class="nav-icon">📒</span> สมุดเงินสด</a>
      <div class="nav-section-label">รายงาน</div>
      <a href="reports.html" class="nav-item"><span class="nav-icon">📊</span> รายงานทั้งหมด</a>
      <a href="register-report.html" class="nav-item active"><span class="nav-icon">📋</span> ทะเบียนเงิน 3 หมวด</a>
    </nav>
    <div class="sidebar-footer"><div class="sidebar-status"><span class="status-dot"></span>ระบบทำงานปกติ</div><button class="btn btn-sm" onclick="logout()" style="background:rgba(255,255,255,0.1);color:#fff;border:none">ออก</button></div>
  </aside>
  <main class="main-content">
    <header class="top-bar">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
        <div class="top-bar-title">📋 ทะเบียนเงิน 3 หมวด</div>
      </div>
      <div class="top-bar-actions">
        <button class="btn btn-secondary btn-sm" onclick="printPage()">🖨️ พิมพ์</button>
        <button class="btn btn-secondary btn-sm" onclick="exportReg()">📥 Export CSV</button>
      </div>
    </header>
    <div class="page-content">
      <!-- Selector -->
      <div style="display:flex;gap:12px;align-items:center;margin-bottom:16px;flex-wrap:wrap">
        <div class="tabs" style="margin-bottom:0;border:none">
          <button class="tab-btn active" id="tab-นอกงบ"     onclick="switchRegTab('นอกงบ')">เงินนอกงบประมาณ</button>
          <button class="tab-btn"        id="tab-แผ่นดิน"   onclick="switchRegTab('แผ่นดิน')">เงินรายได้แผ่นดิน</button>
          <button class="tab-btn"        id="tab-งบ"        onclick="switchRegTab('งบ')">เงินงบประมาณ</button>
        </div>
      </div>
      <!-- Register Table -->
      <div class="card">
        <div class="card-header">
          <div class="card-title" id="reg-title">ทะเบียนเงินนอกงบประมาณ</div>
          <div style="font-size:.78rem;color:var(--text-muted)" id="reg-count"></div>
        </div>
        <div class="card-body" style="padding:0"><div class="table-wrapper">
          <table>
            <thead id="reg-thead">
              <tr><th>ที่</th><th>วันที่</th><th>เลขที่เอกสาร</th><th>รายการ</th><th>รับ (บาท)</th><th>จ่าย (บาท)</th><th>คงเหลือ (บาท)</th></tr>
            </thead>
            <tbody id="reg-tbody"><tr><td colspan="7" style="text-align:center;padding:24px;color:var(--text-muted)">กำลังโหลด...</td></tr></tbody>
          </table>
        </div></div>
      </div>
    </div>
  </main>
</div>
<script src="assets/js/config.js"></script>
<script src="assets/js/utils.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/api.js"></script>
<script>
let _currentRegTab = 'นอกงบ';
let _regData = {};
const regTitles = { 'นอกงบ':'ทะเบียนเงินนอกงบประมาณ', 'แผ่นดิน':'ทะเบียนเงินรายได้แผ่นดิน', 'งบ':'ทะเบียนเงินงบประมาณ' };

document.addEventListener('DOMContentLoaded', async () => {
  if (!requireAnyLogin()) return;
  await loadSystemConfig(); renderUserInfo(); applyRoleVisibility();
  loadRegisterData('นอกงบ');
});

function switchRegTab(type) {
  _currentRegTab = type;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + type)?.classList.add('active');
  document.getElementById('reg-title').textContent = regTitles[type] || type;
  if (!_regData[type]) loadRegisterData(type);
  else renderRegister(_regData[type]);
}

async function loadRegisterData(type) {
  document.getElementById('reg-tbody').innerHTML = '<tr><td colspan="7" style="text-align:center;padding:16px">กำลังโหลด...</td></tr>';
  try {
    const res = await API.getRegisterReport(type);
    _regData[type] = res.rows || [];
    renderRegister(_regData[type]);
  } catch(e) { showToast('โหลดไม่สำเร็จ','error'); }
}

function renderRegister(rows) {
  const tbody = document.getElementById('reg-tbody');
  const countEl = document.getElementById('reg-count');
  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:24px;color:var(--text-muted)">ไม่มีข้อมูล</td></tr>';
    if (countEl) countEl.textContent = '0 รายการ';
    return;
  }
  if (countEl) countEl.textContent = rows.length.toLocaleString() + ' รายการ';

  const headers = Object.keys(rows[0]);
  // สร้าง thead จาก headers จริง
  document.getElementById('reg-thead').innerHTML = '<tr>' + headers.map(h => `<th>${h}</th>`).join('') + '</tr>';

  let runBalance = 0;
  tbody.innerHTML = rows.map((r, i) => {
    const isTotal = Object.values(r).some(v => String(v).includes('รวม') || String(v).includes('ยอด'));
    return '<tr' + (isTotal ? ' style="font-weight:700;background:#f7faff"' : '') + '>' +
      headers.map(h => {
        const v = r[h];
        if (typeof v === 'number') return `<td style="text-align:right">${formatMoney(v)}</td>`;
        if ((h+'').toLowerCase().includes('วัน') || (h+'').toLowerCase().includes('date')) return `<td>${formatThaiDate(v)}</td>`;
        if ((h+'').includes('ที่') && i === 0) return `<td>${i+1}</td>`;
        return `<td>${v !== null && v !== undefined ? v : ''}</td>`;
      }).join('') + '</tr>';
  }).join('');
}

function exportReg() {
  const data = _regData[_currentRegTab];
  if (!data?.length) { showToast('ไม่มีข้อมูล','warning'); return; }
  exportCSV(data, `${regTitles[_currentRegTab]}_${todayISO()}.csv`);
}
</script>
</body>
</html>
