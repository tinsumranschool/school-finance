<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ตั้งค่าระบบ — ระบบบัญชีการเงิน</title>
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header"><img src="assets/img/logo-obec.png" alt="" class="sidebar-logo" onerror="this.style.display='none'"><div class="sidebar-title">ระบบบัญชีการเงิน<br><small>โรงเรียน สพฐ.</small></div></div>
    <div class="sidebar-user"><img src="assets/img/default-avatar.png" class="sidebar-user-photo" id="user-photo"><div class="sidebar-user-info"><div class="sidebar-user-name" id="user-name"></div><div class="sidebar-user-role" id="user-role"></div></div></div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="nav-item"><span class="nav-icon">🏠</span> Dashboard</a>
      <a href="transactions.html" class="nav-item"><span class="nav-icon">📒</span> สมุดเงินสด</a>
      <a href="reports.html" class="nav-item"><span class="nav-icon">📊</span> รายงาน</a>
      <div class="nav-section-label">จัดการระบบ</div>
      <a href="fiscal-year.html" class="nav-item" data-role="admin,director"><span class="nav-icon">📅</span> เปิด/ปิดปีงบ</a>
      <a href="users.html" class="nav-item" data-role="admin"><span class="nav-icon">👤</span> จัดการผู้ใช้งาน</a>
      <a href="settings.html" class="nav-item active" data-role="admin"><span class="nav-icon">⚙️</span> ตั้งค่าระบบ</a>
    </nav>
    <div class="sidebar-footer"><div class="sidebar-status"><span class="status-dot"></span>ระบบทำงานปกติ</div><button class="btn btn-sm" onclick="logout()" style="background:rgba(255,255,255,0.1);color:#fff;border:none">ออก</button></div>
  </aside>
  <main class="main-content">
    <header class="top-bar">
      <div style="display:flex;align-items:center;gap:12px"><button class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button><div class="top-bar-title">⚙️ ตั้งค่าระบบ</div></div>
      <div class="top-bar-actions"><button class="btn btn-primary btn-sm" onclick="saveSettings()">💾 บันทึกตั้งค่า</button></div>
    </header>
    <div class="page-content">
      <div class="card" style="margin-bottom:16px">
        <div class="card-header"><div class="card-title">🏫 ข้อมูลโรงเรียนและงวดรายงาน</div></div>
        <div class="card-body">
          <div class="form-grid">
            <div class="form-group"><label>ชื่อโรงเรียน <span class="required">*</span></label><input type="text" id="cfg-schoolName"></div>
            <div class="form-group"><label>ที่อยู่/สังกัด</label><input type="text" id="cfg-schoolAddr"></div>
            <div class="form-group"><label>วันที่เริ่มรายงาน</label><input type="date" id="cfg-startDate"></div>
            <div class="form-group"><label>วันที่สิ้นสุดรายงาน</label><input type="date" id="cfg-endDate"></div>
            <div class="form-group"><label>ปีงบประมาณ (พ.ศ.)</label><input type="number" id="cfg-fiscalYear" min="2560" max="2600"></div>
            <div class="form-group"><label>เกณฑ์เตือนจำนวนเงินสูง (บาท)</label><input type="number" id="cfg-alertThreshold" min="1000"></div>
          </div>
        </div>
      </div>
      <div class="card" style="margin-bottom:16px">
        <div class="card-header"><div class="card-title">👥 บุคลากรที่รับผิดชอบ</div></div>
        <div class="card-body">
          <div class="form-grid form-grid-3">
            <div class="form-group"><label>หัวหน้าหน่วยงาน (ผอ.)</label><input type="text" id="cfg-director"></div>
            <div class="form-group"><label>เจ้าหน้าที่การเงิน</label><input type="text" id="cfg-officer"></div>
            <div class="form-group"><label>เงินสดยกมา (บาท)</label><input type="number" id="cfg-openingCash" step="0.01" min="0"></div>
            <div class="form-group"><label>กรรมการตรวจนับ คนที่ 1</label><input type="text" id="cfg-committee1"></div>
            <div class="form-group"><label>กรรมการตรวจนับ คนที่ 2</label><input type="text" id="cfg-committee2"></div>
            <div class="form-group"><label>กรรมการตรวจนับ คนที่ 3</label><input type="text" id="cfg-committee3"></div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
<script src="assets/js/config.js"></script>
<script src="assets/js/utils.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/api.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', async () => {
    if (!requireRole('admin')) return;
    await loadSystemConfig();
    renderUserInfo(); applyRoleVisibility();
    const cfg = await API.getConfig();
    const fields = ['schoolName','schoolAddr','startDate','endDate','fiscalYear','alertThreshold','director','officer','openingCash','committee1','committee2','committee3'];
    fields.forEach(f => { const el = document.getElementById('cfg-' + f); if (el && cfg[f] !== undefined) el.value = cfg[f]; });
  });
  async function saveSettings() {
    const fields = ['schoolName','schoolAddr','startDate','endDate','fiscalYear','alertThreshold','director','officer','openingCash','committee1','committee2','committee3'];
    const body = {};
    fields.forEach(f => { const el = document.getElementById('cfg-' + f); if (el) body[f] = el.value; });
    showLoading(true,'บันทึก...');
    try {
      const res = await API.updateConfig(body);
      if (res.success) showToast('บันทึกตั้งค่าสำเร็จ','success');
      else showToast(res.error || 'เกิดข้อผิดพลาด','error');
    } finally { showLoading(false); }
  }
</script>
</body>
</html>
