<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>จัดการผู้ใช้งาน — ระบบบัญชีการเงิน</title>
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header"><img src="assets/img/logo-obec.png" alt="" class="sidebar-logo" onerror="this.style.display='none'"><div class="sidebar-title">ระบบบัญชีการเงิน<br><small>โรงเรียน สพฐ.</small></div></div>
    <div class="sidebar-user"><img src="assets/img/default-avatar.png" class="sidebar-user-photo" id="user-photo"><div class="sidebar-user-info"><div class="sidebar-user-name" id="user-name"></div><div class="sidebar-user-role" id="user-role"></div></div></div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="nav-item"><span class="nav-icon">🏠</span> Dashboard</a>
      <a href="transactions.html" class="nav-item"><span class="nav-icon">📒</span> สมุดเงินสด</a>
      <div class="nav-section-label">จัดการระบบ</div>
      <a href="fiscal-year.html" class="nav-item" data-role="admin,director"><span class="nav-icon">📅</span> เปิด/ปิดปีงบ</a>
      <a href="users.html" class="nav-item active" data-role="admin"><span class="nav-icon">👤</span> จัดการผู้ใช้งาน</a>
      <a href="settings.html" class="nav-item" data-role="admin"><span class="nav-icon">⚙️</span> ตั้งค่าระบบ</a>
    </nav>
    <div class="sidebar-footer"><div class="sidebar-status"><span class="status-dot"></span>ระบบทำงานปกติ</div><button class="btn btn-sm" onclick="logout()" style="background:rgba(255,255,255,0.1);color:#fff;border:none">ออก</button></div>
  </aside>
  <main class="main-content">
    <header class="top-bar">
      <div style="display:flex;align-items:center;gap:12px"><button class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button><div class="top-bar-title">👤 จัดการผู้ใช้งาน</div></div>
      <div class="top-bar-actions"><button class="btn btn-primary btn-sm" onclick="openModal('add-user-modal')">+ เพิ่มผู้ใช้</button></div>
    </header>
    <div class="page-content">
      <div class="card"><div class="card-body" style="padding:0"><div class="table-wrapper">
        <table>
          <thead><tr><th>ชื่อ</th><th>Email</th><th>Role</th><th>สถานะ</th><th>เข้าใช้งานล่าสุด</th><th>จัดการ</th></tr></thead>
          <tbody id="users-tbody"><tr><td colspan="6" style="text-align:center;padding:24px;color:var(--text-muted)">กำลังโหลด...</td></tr></tbody>
        </table>
      </div></div></div>
    </div>
  </main>
</div>
<!-- Add User Modal -->
<div class="modal-overlay" id="add-user-modal" style="display:none" onclick="if(event.target===this)closeModal('add-user-modal')">
  <div class="modal-box">
    <div class="modal-title">เพิ่มผู้ใช้งานใหม่</div>
    <div class="form-grid">
      <div class="form-group"><label>Email Google <span class="required">*</span></label><input type="email" id="new-email" placeholder="user@gmail.com"></div>
      <div class="form-group"><label>ชื่อแสดง</label><input type="text" id="new-name"></div>
      <div class="form-group"><label>Role <span class="required">*</span></label>
        <select id="new-role"><option value="viewer">Viewer (ดูอย่างเดียว)</option><option value="admin">Admin (กรอกข้อมูลได้)</option><option value="director">Director (ผู้อำนวยการ)</option></select>
      </div>
    </div>
    <div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal('add-user-modal')">ยกเลิก</button><button class="btn btn-primary" onclick="addUser()">เพิ่มผู้ใช้</button></div>
  </div>
</div>
<script src="assets/js/config.js"></script>
<script src="assets/js/utils.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/api.js"></script>
<script>
  const roleLabel = { admin:'ผู้ดูแลระบบ', director:'ผู้อำนวยการ', viewer:'ผู้ชม' };
  document.addEventListener('DOMContentLoaded', async () => {
    if (!requireRole('admin')) return;
    await loadSystemConfig(); renderUserInfo(); applyRoleVisibility(); loadUsers();
  });
  async function loadUsers() {
    const res = await API.getUsers();
    const tbody = document.getElementById('users-tbody');
    if (!tbody) return;
    tbody.innerHTML = (res.users || []).map(u => `<tr>
      <td><strong>${u.displayName || '—'}</strong></td>
      <td>${u.email}</td>
      <td><span class="badge badge-info">${roleLabel[u.role] || u.role}</span></td>
      <td><span class="badge ${u.active ? 'badge-success' : 'badge-danger'}">${u.active ? 'ใช้งาน' : 'ระงับ'}</span></td>
      <td style="font-size:.8rem">${u.lastLogin ? formatThaiDateTime(u.lastLogin) : '—'}</td>
      <td>
        <button class="btn btn-sm btn-secondary" onclick="toggleActive('${u.email}',${!u.active})">${u.active ? 'ระงับ' : 'เปิดใช้'}</button>
        <select class="btn btn-sm btn-secondary" onchange="changeRole('${u.email}',this.value)" style="cursor:pointer">
          <option value="">เปลี่ยน Role</option>
          <option value="viewer">Viewer</option><option value="admin">Admin</option><option value="director">Director</option>
        </select>
      </td>
    </tr>`).join('');
  }
  async function addUser() {
    const email = document.getElementById('new-email').value.trim();
    const name  = document.getElementById('new-name').value.trim();
    const role  = document.getElementById('new-role').value;
    if (!email) { showToast('กรอก Email ก่อน','warning'); return; }
    const res = await API.addUser({ email, displayName: name, role });
    if (res.success) { showToast('เพิ่มผู้ใช้สำเร็จ','success'); closeModal('add-user-modal'); loadUsers(); }
    else showToast(res.error || 'เกิดข้อผิดพลาด','error');
  }
  async function toggleActive(email, active) {
    const res = await API.updateUser({ email, active });
    if (res.success) { showToast('อัปเดตสถานะสำเร็จ','success'); loadUsers(); }
    else showToast(res.error,'error');
  }
  async function changeRole(email, role) {
    if (!role) return;
    const ok = await confirmDialog('เปลี่ยน Role','ยืนยันการเปลี่ยน Role ของ ' + email + ' เป็น ' + role + '?');
    if (!ok) return;
    const res = await API.updateUser({ email, role });
    if (res.success) { showToast('เปลี่ยน Role สำเร็จ','success'); loadUsers(); }
    else showToast(res.error,'error');
  }
</script>
</body>
</html>
