<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>บัญชีธนาคาร — ระบบบัญชีการเงิน</title>
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header"><img src="assets/img/logo-obec.png" alt="" class="sidebar-logo" onerror="this.style.display='none'"><div class="sidebar-title">ระบบบัญชีการเงิน<br><small>โรงเรียน สพฐ.</small></div></div>
    <div class="sidebar-user"><img src="assets/img/default-avatar.png" class="sidebar-user-photo" id="user-photo"><div class="sidebar-user-info"><div class="sidebar-user-name" id="user-name"></div><div class="sidebar-user-role" id="user-role"></div></div></div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="nav-item"><span class="nav-icon">🏠</span> Dashboard</a>
      <a href="transactions.html" class="nav-item"><span class="nav-icon">📒</span> สมุดเงินสด</a>
      <a href="bank-accounts.html" class="nav-item active"><span class="nav-icon">🏦</span> บัญชีธนาคาร</a>
      <a href="vendors.html" class="nav-item"><span class="nav-icon">👥</span> ผู้รับเงินและผู้ขาย</a>
      <a href="reports.html" class="nav-item"><span class="nav-icon">📊</span> รายงาน</a>
      <a href="settings.html" class="nav-item" data-role="admin"><span class="nav-icon">⚙️</span> ตั้งค่าระบบ</a>
    </nav>
    <div class="sidebar-footer"><div class="sidebar-status"><span class="status-dot"></span>ระบบทำงานปกติ</div><button class="btn btn-sm" onclick="logout()" style="background:rgba(255,255,255,0.1);color:#fff;border:none">ออก</button></div>
  </aside>
  <main class="main-content">
    <header class="top-bar">
      <div style="display:flex;align-items:center;gap:12px"><button class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button><div class="top-bar-title">🏦 บัญชีธนาคาร</div></div>
      <div class="top-bar-actions"><button class="btn btn-primary btn-sm" data-role="admin" onclick="openModal('bank-modal')">+ เพิ่มบัญชี</button></div>
    </header>
    <div class="page-content">
      <div class="card"><div class="card-body" style="padding:0"><div class="table-wrapper">
        <table>
          <thead><tr><th>รหัส</th><th>ธนาคาร</th><th>เลขที่บัญชี</th><th>ชื่อบัญชี</th><th>หมวดเงิน</th><th>ยอดยกมา</th><th>สถานะ</th><th data-role="admin">จัดการ</th></tr></thead>
          <tbody id="bank-tbody"><tr><td colspan="8" style="text-align:center;padding:24px;color:var(--text-muted)">กำลังโหลด...</td></tr></tbody>
        </table>
      </div></div></div>
    </div>
  </main>
</div>
<div class="modal-overlay" id="bank-modal" style="display:none" onclick="if(event.target===this)closeModal('bank-modal')">
  <div class="modal-box">
    <div class="modal-title" id="bank-modal-title">เพิ่มบัญชีธนาคาร</div>
    <input type="hidden" id="bank-row-index">
    <div class="form-grid">
      <div class="form-group"><label>ธนาคาร <span class="required">*</span></label>
        <select id="b-bank"><option value="">เลือก...</option><option>กรุงเทพ</option><option>กสิกรไทย</option><option>ไทยพาณิชย์</option><option>กรุงไทย</option><option>ออมสิน</option></select>
      </div>
      <div class="form-group"><label>สาขา</label><input type="text" id="b-branch"></div>
      <div class="form-group"><label>เลขที่บัญชี <span class="required">*</span></label><input type="text" id="b-accountno"></div>
      <div class="form-group"><label>ประเภทบัญชี</label><select id="b-accounttype"><option>ออมทรัพย์</option><option>กระแสรายวัน</option></select></div>
      <div class="form-group"><label>ชื่อบัญชี <span class="required">*</span></label><input type="text" id="b-name"></div>
      <div class="form-group"><label>หมวดเงิน <span class="required">*</span></label><select id="b-category"><option value="">เลือก...</option><option>เงินนอกงบประมาณ</option><option>เงินรายได้แผ่นดิน</option><option>เงินงบประมาณ</option></select></div>
      <div class="form-group"><label>ยอดยกมา (บาท)</label><input type="number" id="b-opening" min="0" step="0.01" value="0"></div>
      <div class="form-group"><label>สถานะ</label><select id="b-active"><option value="true">ใช้งาน</option><option value="false">ไม่ใช้งาน</option></select></div>
    </div>
    <div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal('bank-modal')">ยกเลิก</button><button class="btn btn-primary" onclick="saveBankAccount()">💾 บันทึก</button></div>
  </div>
</div>
<script src="assets/js/config.js"></script>
<script src="assets/js/utils.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/api.js"></script>
<script>
  let _editBank = null;
  document.addEventListener('DOMContentLoaded', async () => {
    if (!requireAnyLogin()) return;
    await loadSystemConfig(); renderUserInfo(); applyRoleVisibility(); loadBanks();
  });
  async function loadBanks() {
    const res = await API.getBankAccounts();
    const tbody = document.getElementById('bank-tbody');
    const isAdmin = getCurrentUser()?.role === 'admin';
    tbody.innerHTML = (res.accounts || []).map(b => `<tr>
      <td><code>${b['รหัสบัญชี']||b.id||''}</code></td>
      <td>${b['ธนาคาร']||''}</td><td>${b['เลขที่บัญชี']||''}</td>
      <td>${b['ชื่อบัญชี']||''}</td><td><span class="badge badge-info">${b['หมวดเงิน']||''}</span></td>
      <td>${formatMoney(b['ยอดยกมา (บาท)']||0)}</td>
      <td><span class="badge ${b['สถานะ']==='ใช้งาน'?'badge-success':'badge-muted'}">${b['สถานะ']||''}</span></td>
      ${isAdmin ? `<td><button class="btn btn-sm btn-secondary" onclick='editBank(${JSON.stringify(b)})'>✏️</button></td>` : '<td></td>'}
    </tr>`).join('');
  }
  function editBank(b) {
    _editBank = b;
    document.getElementById('bank-modal-title').textContent = 'แก้ไขบัญชีธนาคาร';
    document.getElementById('bank-row-index').value = b.rowIndex;
    document.getElementById('b-bank').value        = b['ธนาคาร']||'';
    document.getElementById('b-branch').value      = b['สาขา']||'';
    document.getElementById('b-accountno').value   = b['เลขที่บัญชี']||'';
    document.getElementById('b-accounttype').value = b['ประเภทบัญชี']||'ออมทรัพย์';
    document.getElementById('b-name').value        = b['ชื่อบัญชี']||'';
    document.getElementById('b-category').value    = b['หมวดเงิน']||'';
    document.getElementById('b-opening').value     = b['ยอดยกมา (บาท)']||0;
    document.getElementById('b-active').value      = b['สถานะ']==='ใช้งาน'?'true':'false';
    openModal('bank-modal');
  }
  async function saveBankAccount() {
    const data = {
      rowIndex: document.getElementById('bank-row-index').value || undefined,
      bank: document.getElementById('b-bank').value,
      branch: document.getElementById('b-branch').value,
      accountNo: document.getElementById('b-accountno').value,
      accountType: document.getElementById('b-accounttype').value,
      name: document.getElementById('b-name').value,
      category: document.getElementById('b-category').value,
      openingBalance: document.getElementById('b-opening').value,
      active: document.getElementById('b-active').value === 'true',
    };
    if (!data.bank || !data.accountNo || !data.name || !data.category) { showToast('กรอกข้อมูลให้ครบ','warning'); return; }
    const res = data.rowIndex ? await API.updateBankAccount(data) : await API.addBankAccount(data);
    if (res.success) { showToast('บันทึกสำเร็จ','success'); closeModal('bank-modal'); loadBanks(); _editBank = null; }
    else showToast(res.error||'เกิดข้อผิดพลาด','error');
  }
</script>
</body>
</html>
