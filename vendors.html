<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ผู้รับเงินและผู้ขาย — ระบบบัญชีการเงิน</title>
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header"><img src="assets/img/logo-obec.png" alt="" class="sidebar-logo" onerror="this.style.display='none'"><div class="sidebar-title">ระบบบัญชีการเงิน<br><small>โรงเรียน สพฐ.</small></div></div>
    <div class="sidebar-user"><img src="assets/img/default-avatar.png" class="sidebar-user-photo" id="user-photo"><div class="sidebar-user-info"><div class="sidebar-user-name" id="user-name"></div><div class="sidebar-user-role" id="user-role"></div></div></div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="nav-item"><span class="nav-icon">🏠</span> Dashboard</a>
      <a href="transactions.html" class="nav-item"><span class="nav-icon">📒</span> สมุดเงินสด</a>
      <a href="bank-accounts.html" class="nav-item"><span class="nav-icon">🏦</span> บัญชีธนาคาร</a>
      <a href="vendors.html" class="nav-item active"><span class="nav-icon">👥</span> ผู้รับเงินและผู้ขาย</a>
      <a href="reports.html" class="nav-item"><span class="nav-icon">📊</span> รายงาน</a>
    </nav>
    <div class="sidebar-footer"><div class="sidebar-status"><span class="status-dot"></span>ระบบทำงานปกติ</div><button class="btn btn-sm" onclick="logout()" style="background:rgba(255,255,255,0.1);color:#fff;border:none">ออก</button></div>
  </aside>
  <main class="main-content">
    <header class="top-bar">
      <div style="display:flex;align-items:center;gap:12px"><button class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button><div class="top-bar-title">👥 ผู้รับเงินและผู้ขาย</div></div>
      <div class="top-bar-actions">
        <input type="text" id="v-search" placeholder="ค้นหาชื่อ..." style="padding:7px 12px;border:1.5px solid var(--border);border-radius:7px;font-family:inherit;font-size:.85rem" oninput="filterVendors()">
        <button class="btn btn-primary btn-sm" data-role="admin" onclick="openModal('vendor-modal')">+ เพิ่มรายการ</button>
      </div>
    </header>
    <div class="page-content">
      <div class="card"><div class="card-body" style="padding:0"><div class="table-wrapper">
        <table>
          <thead><tr><th>รหัส</th><th>ชื่อ</th><th>เลขประจำตัว/ภาษี</th><th>โทรศัพท์</th><th>บัญชีธนาคาร</th><th>หมายเหตุ</th><th data-role="admin">จัดการ</th></tr></thead>
          <tbody id="vendor-tbody"></tbody>
        </table>
      </div></div></div>
    </div>
  </main>
</div>
<div class="modal-overlay" id="vendor-modal" style="display:none" onclick="if(event.target===this)closeModal('vendor-modal')">
  <div class="modal-box">
    <div class="modal-title">เพิ่มผู้รับเงิน/ผู้ขาย</div>
    <div class="form-grid">
      <div class="form-group"><label>ชื่อผู้รับเงิน/ผู้ขาย <span class="required">*</span></label><input type="text" id="v-name"></div>
      <div class="form-group"><label>เลขประจำตัว/ภาษี</label><input type="text" id="v-taxid"></div>
      <div class="form-group full-width"><label>ที่อยู่</label><textarea id="v-address" rows="2"></textarea></div>
      <div class="form-group"><label>โทรศัพท์</label><input type="text" id="v-phone"></div>
      <div class="form-group"><label>บัญชีธนาคาร</label><input type="text" id="v-bankaccount" placeholder="ธ.กสิกร 123-4-56789-0"></div>
      <div class="form-group full-width"><label>หมายเหตุ</label><input type="text" id="v-note"></div>
    </div>
    <div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal('vendor-modal')">ยกเลิก</button><button class="btn btn-primary" onclick="saveVendor()">💾 บันทึก</button></div>
  </div>
</div>
<script src="assets/js/config.js"></script>
<script src="assets/js/utils.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/api.js"></script>
<script>
  let _allVendors = [];
  document.addEventListener('DOMContentLoaded', async () => {
    if (!requireAnyLogin()) return;
    await loadSystemConfig(); renderUserInfo(); applyRoleVisibility(); loadVendors();
  });
  async function loadVendors() {
    const res = await API.getVendors();
    _allVendors = res.vendors || [];
    renderVendors(_allVendors);
  }
  function filterVendors() {
    const q = document.getElementById('v-search').value.toLowerCase();
    renderVendors(_allVendors.filter(v => (v['ชื่อผู้รับเงิน/ผู้ขาย']||'').toLowerCase().includes(q)));
  }
  function renderVendors(list) {
    const isAdmin = getCurrentUser()?.role === 'admin';
    document.getElementById('vendor-tbody').innerHTML = list.map(v => `<tr>
      <td><code style="font-size:.78rem">${v['รหัส']||''}</code></td>
      <td><strong>${v['ชื่อผู้รับเงิน/ผู้ขาย']||''}</strong></td>
      <td style="font-size:.8rem">${v['เลขประจำตัว/ภาษี']||'—'}</td>
      <td>${v['โทรศัพท์']||'—'}</td>
      <td style="font-size:.8rem">${v['บัญชีธนาคาร']||'—'}</td>
      <td style="font-size:.8rem;color:var(--text-muted)">${v['หมายเหตุ']||''}</td>
      ${isAdmin ? '<td><button class="btn btn-sm btn-secondary" disabled>✏️</button></td>' : '<td></td>'}
    </tr>`).join('') || '<tr><td colspan="7" style="text-align:center;padding:24px;color:var(--text-muted)">ไม่มีข้อมูล</td></tr>';
  }
  async function saveVendor() {
    const data = { name: document.getElementById('v-name').value.trim(), taxId: document.getElementById('v-taxid').value, address: document.getElementById('v-address').value, phone: document.getElementById('v-phone').value, bankAccount: document.getElementById('v-bankaccount').value, note: document.getElementById('v-note').value };
    if (!data.name) { showToast('กรอกชื่อก่อน','warning'); return; }
    const res = await API.addVendor(data);
    if (res.success) { showToast('เพิ่มสำเร็จ','success'); closeModal('vendor-modal'); loadVendors(); ['v-name','v-taxid','v-address','v-phone','v-bankaccount','v-note'].forEach(id => document.getElementById(id).value = ''); }
    else showToast(res.error||'เกิดข้อผิดพลาด','error');
  }
</script>
</body>
</html>
